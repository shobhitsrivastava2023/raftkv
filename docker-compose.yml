x-node: &node
  build: .
  image: raftkv:local
  restart: "no"
  environment: &env
    RAFTKV_PORT: "9000"
    RAFTKV_DATA: /data
    RAFTKV_PEERS: n1=n1:9000,n2=n2:9000,n3=n3:9000
    RAFTKV_CLIENT_ADDRS: n1=localhost:9001,n2=localhost:9002,n3=localhost:9003

services:
  n1:
    <<: *node
    container_name: raftkv-n1
    hostname: n1
    environment: { <<: *env, RAFTKV_ID: n1 }
    ports: ["9001:9000"]
    volumes: [n1-data:/data]
  n2:
    <<: *node
    container_name: raftkv-n2
    hostname: n2
    environment: { <<: *env, RAFTKV_ID: n2 }
    ports: ["9002:9000"]
    volumes: [n2-data:/data]
  n3:
    <<: *node
    container_name: raftkv-n3
    hostname: n3
    environment: { <<: *env, RAFTKV_ID: n3 }
    ports: ["9003:9000"]
    volumes: [n3-data:/data]

volumes:
  n1-data:
  n2-data:
  n3-data:
